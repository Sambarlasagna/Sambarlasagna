<style>text{font-family:Georgia,'Times New Roman',serif}</style><rect width="1000" height="640" fill="url(#bg)"/><rect x="10" y="10" width="980" height="620" fill="none" stroke="#c8953a" stroke-opacity="0.55" stroke-width="1.5"/><rect x="18" y="18" width="964" height="604" fill="none" stroke="#c8953a" stroke-opacity="0.22"/><polygon points="10,4 16,10 10,16 4,10" fill="#ffe9a8"/><polygon points="990,4 996,10 990,16 984,10" fill="#ffe9a8"/><polygon points="10,624 16,630 10,636 4,630" fill="#ffe9a8"/><polygon points="990,624 996,630 990,636 984,630" fill="#ffe9a8"/><line x1="62" y1="62" x2="62" y2="468" stroke="#c8953a" stroke-opacity="0.5" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></line><polygon points="62,48 70,56 62,64 54,56" fill="#ffe9a8"><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="0.6s" repeatCount="indefinite"/></polygon><circle cx="62" cy="56" r="4" fill="none" stroke="#ffe9a8"><animate attributeName="r" values="4;16" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle><text x="90" y="62" font-size="20" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">Full-Stack Engineer Intern</text><text x="950" y="62" font-size="14" fill="#c8953a" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">May 2026 – Jun 2026</text><text x="90" y="86" font-size="15" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Sona BLW Precision Forgings Ltd. (Comstar Automotive)</text><polygon points="94,106 98,110 94,114 90,110" fill="#c8953a"/><text x="108" y="114" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Built a React and Express.js product database portal with interactive dashboards for automotive motor spec</text><text x="108" y="134" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">analysis.</text><polygon points="94,150 98,154 94,158 90,154" fill="#c8953a"/><text x="108" y="158" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Migrated a legacy PHP backend to a RESTful API with optimized SQL; ran an OWASP VAPT and shipped critical</text><text x="108" y="178" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">security patches.</text><polygon points="94,194 98,198 94,202 90,198" fill="#c8953a"/><text x="108" y="202" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Filterable data-table views across 500+ product entries cut manual lookup time by about 70%.</text><polygon points="62,234 70,242 62,250 54,242" fill="#ffe9a8"><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="1.2s" repeatCount="indefinite"/></polygon><circle cx="62" cy="242" r="4" fill="none" stroke="#ffe9a8"><animate attributeName="r" values="4;16" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><text x="90" y="248" font-size="20" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">Machine Learning Team Member</text><text x="950" y="248" font-size="14" fill="#c8953a" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">Oct 2025 – Present</text><text x="90" y="272" font-size="15" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Microsoft Innovations Club, VIT Chennai</text><polygon points="94,292 98,296 94,300 90,296" fill="#c8953a"/><text x="108" y="300" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Developed ML solutions for inter-college technical competitions.</text><polygon points="62,332 70,340 62,348 54,340" fill="#ffe9a8"><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="1.8s" repeatCount="indefinite"/></polygon><circle cx="62" cy="340" r="4" fill="none" stroke="#ffe9a8"><animate attributeName="r" values="4;16" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle><text x="90" y="346" font-size="20" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">Technical Team Member</text><text x="950" y="346" font-size="14" fill="#c8953a" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">Feb 2025 – Present</text><text x="90" y="370" font-size="15" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Artificial Intelligence Club, VIT Chennai</text><polygon points="94,390 98,394 94,398 90,394" fill="#c8953a"/><text x="108" y="398" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Organized hackathons for students.</text><polygon points="94,414 98,418 94,422 90,418" fill="#c8953a"/><text x="108" y="422" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Built technical solutions for competitions.</text><polygon points="62,454 70,462 62,470 54,462" fill="#ffe9a8"><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" begin="2.4s" repeatCount="indefinite"/></polygon><circle cx="62" cy="462" r="4" fill="none" stroke="#ffe9a8"><animate attributeName="r" values="4;16" dur="3s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle><text x="90" y="468" font-size="20" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">Technical Team Member</text><text x="90" y="492" font-size="15" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Open Source Programming Club, VIT Chennai</text><polygon points="94,512 98,516 94,520 90,516" fill="#c8953a"/><text x="108" y="520" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Built a hackathon teammate-finding portal in modern React where VIT students find teammates through listed</text><text x="108" y="540" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">skills, resumes and more.</text><polygon points="94,556 98,560 94,564 90,560" fill="#c8953a"/><text x="108" y="564" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Contribute to open source repositories.</text><polygon points="94,580 98,584 94,588 90,584" fill="#c8953a"/><text x="108" y="588" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Organize technical events.</text></svg>