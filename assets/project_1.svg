<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 322" width="1000" height="322"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0906"/><stop offset="1" stop-color="#17110a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a87a2a"/><stop offset="0.5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c8953a"/></linearGradient>
<linearGradient id="gm" x1="-0.6" y1="0" x2="0.4" y2="0"><stop offset="0" stop-color="#a87a2a"/><stop offset="0.5" stop-color="#fff6d8"/><stop offset="1" stop-color="#c8953a"/><animate attributeName="x1" values="-0.6;1;1" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="0.4;2;2" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6320"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8953a" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c8953a" stop-opacity="0"/></linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c9"/><stop offset="1" stop-color="#b8862f"/></linearGradient>
<linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff6d8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9a8" stop-opacity="0.14"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs>
<style>text{font-family:Georgia,'Times New Roman',serif}</style><rect width="1000" height="322" fill="url(#bg)"/><rect x="10" y="10" width="980" height="302" fill="none" stroke="#c8953a" stroke-opacity="0.55" stroke-width="1.5"/><rect x="18" y="18" width="964" height="286" fill="none" stroke="#c8953a" stroke-opacity="0.22"/><polygon points="10,4 16,10 10,16 4,10" fill="#ffe9a8"/><polygon points="990,4 996,10 990,16 984,10" fill="#ffe9a8"/><polygon points="10,306 16,312 10,318 4,312" fill="#ffe9a8"/><polygon points="990,306 996,312 990,318 984,312" fill="#ffe9a8"/><ellipse cx="95" cy="161.0" rx="90" ry="110" fill="url(#gl)" opacity="0.16"><animate attributeName="opacity" values="0.08;0.24;0.08" dur="6s" repeatCount="indefinite"/></ellipse><polygon points="95,99.0 147,161.0 95,223.0 43,161.0" fill="#120e08" stroke="#c8953a" stroke-opacity="0.7" stroke-width="1.5"/><polygon points="95,109.0 137,161.0 95,213.0 53,161.0" fill="none" stroke="#c8953a" stroke-opacity="0.3"/><g transform="translate(95,161.0)"><g stroke="#ffe9a8" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="-34,0 -18,0 -10,-22 2,24 12,-12 20,0 34,0" stroke-opacity="0.3"/><polyline points="-34,0 -18,0 -10,-22 2,24 12,-12 20,0 34,0" pathLength="100" stroke-dasharray="22 78" stroke="#fff6d8" stroke-width="2.8"><animate attributeName="stroke-dashoffset" values="22;-100" dur="2.4s" repeatCount="indefinite"/></polyline></g></g><text x="180" y="52" font-size="25" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">Connected Fleet Telemetry</text><text x="180" y="76" font-size="14" fill="#9c8860" text-anchor="start" font-weight="normal" font-style="italic" letter-spacing="0">Predictive maintenance and real-time ML platform</text><line x1="180" y1="86" x2="780" y2="86" stroke="url(#fade)"/><polygon points="182,103 187,108 182,113 177,108" fill="#c8953a"/><text x="196" y="112" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Distributed PySpark pipeline over 876,000 telemetry rows from 5 vehicle</text><text x="196" y="132" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">datasets, with rolling 3h/24h sensor features.</text><polygon points="182,149 187,154 182,159 177,154" fill="#c8953a"/><text x="196" y="158" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Spark MLlib Random Forest trained on a chronological split to prevent</text><text x="196" y="178" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">leakage, served through FastAPI with SHAP explainability.</text><polygon points="182,195 187,200 182,205 177,200" fill="#c8953a"/><text x="196" y="204" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">FleetGuard React dashboard, Airflow retraining, Terraform on AWS and</text><text x="196" y="224" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Kubernetes, Prometheus and Grafana monitoring.</text><rect x="180" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="213.1" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">PySpark</text><rect x="254.2" y="247" width="53.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="280.7" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Kafka</text><rect x="315.2" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="348.29999999999995" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">FastAPI</text><rect x="389.4" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="432.4" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">PostgreSQL</text><rect x="483.4" y="247" width="59.599999999999994" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="513.1999999999999" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">MLflow</text><rect x="551.0" y="247" width="59.599999999999994" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="580.8" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Docker</text><rect x="618.6" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="661.6" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Kubernetes</text><rect x="712.6" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="745.7" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Airflow</text><rect x="786.8" y="247" width="79.4" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="826.5" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Terraform</text><rect x="874.1999999999999" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="917.1999999999999" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Prometheus</text><rect x="180" y="277" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="213.1" y="292" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Grafana</text><rect x="254.2" y="277" width="53.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="280.7" y="292" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">React</text><rect x="315.2" y="277" width="46.4" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="338.4" y="292" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">SHAP</text><rect x="369.59999999999997" y="277" width="39.8" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="389.49999999999994" y="292" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">AWS</text><text x="968" y="66" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">0.97</text><text x="968" y="84" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">AUC-ROC</text><text x="968" y="120" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">89.6%</text><text x="968" y="138" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">failure recall</text><text x="968" y="174" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">876K</text><text x="968" y="192" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">rows processed</text><clipPath id="pc"><rect x="20" y="20" width="960" height="282"/></clipPath><g clip-path="url(#pc)"><rect x="-200" y="20" width="140" height="282" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="-200;1100;1100" keyTimes="0;0.5;1" dur="10s" begin="1.3s" repeatCount="indefinite"/></rect></g></svg>