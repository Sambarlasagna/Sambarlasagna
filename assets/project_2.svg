<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0906"/><stop offset="1" stop-color="#17110a"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a87a2a"/><stop offset="0.5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c8953a"/></linearGradient>
<linearGradient id="gm" x1="-0.6" y1="0" x2="0.4" y2="0"><stop offset="0" stop-color="#a87a2a"/><stop offset="0.5" stop-color="#fff6d8"/><stop offset="1" stop-color="#c8953a"/><animate attributeName="x1" values="-0.6;1;1" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/><animate attributeName="x2" values="0.4;2;2" keyTimes="0;0.6;1" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6320"/><stop offset="1" stop-color="#ffe08a"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8953a" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9a8"/><stop offset="1" stop-color="#c8953a" stop-opacity="0"/></linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c9"/><stop offset="1" stop-color="#b8862f"/></linearGradient>
<linearGradient id="glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff6d8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9a8" stop-opacity="0.14"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient>
<radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
</defs>
<style>text{font-family:Georgia,'Times New Roman',serif}</style><rect width="1000" height="292" fill="url(#bg)"/><rect x="10" y="10" width="980" height="272" fill="none" stroke="#c8953a" stroke-opacity="0.55" stroke-width="1.5"/><rect x="18" y="18" width="964" height="256" fill="none" stroke="#c8953a" stroke-opacity="0.22"/><polygon points="10,4 16,10 10,16 4,10" fill="#ffe9a8"/><polygon points="990,4 996,10 990,16 984,10" fill="#ffe9a8"/><polygon points="10,276 16,282 10,288 4,282" fill="#ffe9a8"/><polygon points="990,276 996,282 990,288 984,282" fill="#ffe9a8"/><ellipse cx="95" cy="146.0" rx="90" ry="110" fill="url(#gl)" opacity="0.16"><animate attributeName="opacity" values="0.08;0.24;0.08" dur="6s" repeatCount="indefinite"/></ellipse><polygon points="95,84.0 147,146.0 95,208.0 43,146.0" fill="#120e08" stroke="#c8953a" stroke-opacity="0.7" stroke-width="1.5"/><polygon points="95,94.0 137,146.0 95,198.0 53,146.0" fill="none" stroke="#c8953a" stroke-opacity="0.3"/><g transform="translate(95,146.0)"><g stroke="#ffe9a8" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><g><animateTransform attributeName="transform" type="rotate" values="-28;28;-28" dur="5s" repeatCount="indefinite"/><circle r="26"/><circle r="6"/><line x1="-26" y1="0" x2="-6" y2="0"/><line x1="6" y1="0" x2="26" y2="0"/><line x1="0" y1="6" x2="0" y2="26"/></g></g></g><text x="180" y="52" font-size="25" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">End-to-End Autonomous Steering</text><text x="180" y="76" font-size="14" fill="#9c8860" text-anchor="start" font-weight="normal" font-style="italic" letter-spacing="0">Behavioral cloning with a CNN</text><line x1="180" y1="86" x2="780" y2="86" stroke="url(#fade)"/><polygon points="182,103 187,108 182,113 177,108" fill="#c8953a"/><text x="196" y="112" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">NVIDIA-style CNN in PyTorch that predicts continuous steering angles from</text><text x="196" y="132" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">monocular road images.</text><polygon points="182,149 187,154 182,159 177,154" fill="#c8953a"/><text x="196" y="158" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Cropping, YUV conversion, blur and normalization, plus flip, brightness</text><text x="196" y="178" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">and translation augmentation.</text><polygon points="182,195 187,200 182,205 177,200" fill="#c8953a"/><text x="196" y="204" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Offline inference with steering-vector overlay and temporal smoothing,</text><text x="196" y="224" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">evaluated on a chronological train/val/test split.</text><rect x="180" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="213.1" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">PyTorch</text><rect x="254.2" y="247" width="59.599999999999994" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="284.0" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">OpenCV</text><rect x="321.79999999999995" y="247" width="53.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="348.29999999999995" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">NumPy</text><rect x="382.79999999999995" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="425.79999999999995" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Matplotlib</text><text x="968" y="66" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">CNN</text><text x="968" y="84" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">image to steering angle</text><text x="968" y="120" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">Temporal</text><text x="968" y="138" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">smoothed inference</text><clipPath id="pc"><rect x="20" y="20" width="960" height="252"/></clipPath><g clip-path="url(#pc)"><rect x="-200" y="20" width="140" height="252" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="-200;1100;1100" keyTimes="0;0.5;1" dur="11s" begin="2.6s" repeatCount="indefinite"/></rect></g></svg>