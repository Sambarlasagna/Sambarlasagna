<line x1="0" y1="-18.0" x2="0" y2="18.0"/></g><g><animateTransform attributeName="transform" type="scale" values="1 0.35;1 1;1 0.35" dur="1.75s" begin="0.60s" repeatCount="indefinite"/><line x1="8" y1="-11.0" x2="8" y2="11.0"/></g><g><animateTransform attributeName="transform" type="scale" values="1 0.35;1 1;1 0.35" dur="1.88s" begin="0.72s" repeatCount="indefinite"/><line x1="16" y1="-5.0" x2="16" y2="5.0"/></g><g><animateTransform attributeName="transform" type="scale" values="1 0.35;1 1;1 0.35" dur="2.01s" begin="0.84s" repeatCount="indefinite"/><line x1="24" y1="-13.0" x2="24" y2="13.0"/></g><g><animateTransform attributeName="transform" type="scale" values="1 0.35;1 1;1 0.35" dur="2.14s" begin="0.96s" repeatCount="indefinite"/><line x1="32" y1="-6.0" x2="32" y2="6.0"/></g></g></g><text x="180" y="52" font-size="25" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">AutoNotes-Pro</text><text x="180" y="76" font-size="14" fill="#9c8860" text-anchor="start" font-weight="normal" font-style="italic" letter-spacing="0">Lecture audio to notes, quizzes and resources</text><line x1="180" y1="86" x2="780" y2="86" stroke="url(#fade)"/><polygon points="182,103 187,108 182,113 177,108" fill="#c8953a"/><text x="196" y="112" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Transcribes 1h+ lectures and generates structured notes, quizzes and</text><text x="196" y="132" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">curated resources with Llama 3.1.</text><polygon points="182,149 187,154 182,159 177,154" fill="#c8953a"/><text x="196" y="158" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">RAG pipeline on ChromaDB and Sentence Transformers for context-grounded</text><text x="196" y="178" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Q&amp;A with less hallucination.</text><polygon points="182,195 187,200 182,205 177,200" fill="#c8953a"/><text x="196" y="204" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Audio chunking and CPU/GPU isolation for stable on-device inference,</text><text x="196" y="224" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">exposed over a FastAPI REST API with PDF export.</text><rect x="180" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="213.1" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">FastAPI</text><rect x="254.2" y="247" width="79.4" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="293.9" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Llama 3.1</text><rect x="341.6" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="374.70000000000005" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Whisper</text><rect x="415.8" y="247" width="72.8" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="452.2" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">ChromaDB</text><rect x="496.6" y="247" width="158.6" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="575.9" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Sentence Transformers</text><rect x="663.2" y="247" width="46.4" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="686.4000000000001" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">FPDF</text><text x="968" y="66" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">1h+</text><text x="968" y="84" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">lecture audio</text><text x="968" y="120" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">RAG</text><text x="968" y="138" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">grounded Q&amp;A</text><text x="968" y="174" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">PDF</text><text x="968" y="192" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">notes and quizzes</text><clipPath id="pc"><rect x="20" y="20" width="960" height="252"/></clipPath><g clip-path="url(#pc)"><rect x="-200" y="20" width="140" height="252" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="-200;1100;1100" keyTimes="0;0.5;1" dur="12s" begin="3.9s" repeatCount="indefinite"/></rect></g></svg>