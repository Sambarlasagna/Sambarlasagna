<style>text{font-family:Georgia,'Times New Roman',serif}</style><rect width="1000" height="292" fill="url(#bg)"/><rect x="10" y="10" width="980" height="272" fill="none" stroke="#c8953a" stroke-opacity="0.55" stroke-width="1.5"/><rect x="18" y="18" width="964" height="256" fill="none" stroke="#c8953a" stroke-opacity="0.22"/><polygon points="10,4 16,10 10,16 4,10" fill="#ffe9a8"/><polygon points="990,4 996,10 990,16 984,10" fill="#ffe9a8"/><polygon points="10,276 16,282 10,288 4,282" fill="#ffe9a8"/><polygon points="990,276 996,282 990,288 984,282" fill="#ffe9a8"/><ellipse cx="95" cy="146.0" rx="90" ry="110" fill="url(#gl)" opacity="0.16"><animate attributeName="opacity" values="0.08;0.24;0.08" dur="6s" repeatCount="indefinite"/></ellipse><polygon points="95,84.0 147,146.0 95,208.0 43,146.0" fill="#120e08" stroke="#c8953a" stroke-opacity="0.7" stroke-width="1.5"/><polygon points="95,94.0 137,146.0 95,198.0 53,146.0" fill="none" stroke="#c8953a" stroke-opacity="0.3"/><g transform="translate(95,146.0)"><g stroke="#ffe9a8" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="-30" y1="26" x2="30" y2="26"/><rect x="-26" y="4" width="10" height="22"><animate attributeName="height" values="0;22;22;0" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="y" values="26;4;4;26" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="-5" y="-12" width="10" height="38"><animate attributeName="height" values="0;38;38;0" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.35s" repeatCount="indefinite"/><animate attributeName="y" values="26;-12;-12;26" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.35s" repeatCount="indefinite"/></rect><rect x="16" y="-26" width="10" height="52"><animate attributeName="height" values="0;52;52;0" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.70s" repeatCount="indefinite"/><animate attributeName="y" values="26;-26;-26;26" keyTimes="0;0.4;0.85;1" dur="4s" begin="0.70s" repeatCount="indefinite"/></rect></g></g><text x="180" y="52" font-size="25" fill="url(#gold)" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="1">CineScope</text><text x="180" y="76" font-size="14" fill="#9c8860" text-anchor="start" font-weight="normal" font-style="italic" letter-spacing="0">Movie sentiment analysis platform</text><line x1="180" y1="86" x2="780" y2="86" stroke="url(#fade)"/><polygon points="182,103 187,108 182,113 177,108" fill="#c8953a"/><text x="196" y="112" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">CNN and LSTM sentiment classifiers trained on 50K IMDb reviews; best model</text><text x="196" y="132" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">deployed with FastAPI.</text><polygon points="182,149 187,154 182,159 177,154" fill="#c8953a"/><text x="196" y="158" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">Hugging Face bert-base-uncased tokenization, weighted loss for class</text><text x="196" y="178" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">imbalance, systematic hyperparameter tuning.</text><polygon points="182,195 187,200 182,205 177,200" fill="#c8953a"/><text x="196" y="204" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">MLflow experiment tracking, Prometheus and Grafana monitoring, PostgreSQL</text><text x="196" y="224" font-size="14" fill="#ecdcb0" text-anchor="start" font-weight="normal" font-style="normal" letter-spacing="0">storage, one-command Docker Compose deployment.</text><rect x="180" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="213.1" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">PyTorch</text><rect x="254.2" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="287.29999999999995" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">FastAPI</text><rect x="328.4" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="371.4" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">PostgreSQL</text><rect x="422.4" y="247" width="59.599999999999994" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="452.2" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Docker</text><rect x="490.0" y="247" width="86.0" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="533.0" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Prometheus</text><rect x="584.0" y="247" width="66.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="617.1" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Grafana</text><rect x="658.2" y="247" width="59.599999999999994" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="688.0" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">MLflow</text><rect x="725.8000000000001" y="247" width="99.19999999999999" height="22" rx="3" fill="#1a1409" stroke="#c8953a" stroke-opacity="0.45"/><text x="775.4000000000001" y="262" font-size="11.5" fill="#ffe9a8" text-anchor="middle" font-weight="normal" font-style="normal" letter-spacing="0">Hugging Face</text><text x="968" y="66" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">89.5%</text><text x="968" y="84" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">CNN accuracy</text><text x="968" y="120" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">88.5%</text><text x="968" y="138" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">LSTM accuracy</text><text x="968" y="174" font-size="27" fill="#ffe9a8" text-anchor="end" font-weight="bold" font-style="normal" letter-spacing="0">50K</text><text x="968" y="192" font-size="11.5" fill="#9c8860" text-anchor="end" font-weight="normal" font-style="italic" letter-spacing="0">IMDb reviews</text><clipPath id="pc"><rect x="20" y="20" width="960" height="252"/></clipPath><g clip-path="url(#pc)"><rect x="-200" y="20" width="140" height="252" fill="url(#sweep)" transform="skewX(-18)"><animate attributeName="x" values="-200;1100;1100" keyTimes="0;0.5;1" dur="13s" begin="5.2s" repeatCount="indefinite"/></rect></g></svg>